name: Cloudflare Preview Comments

on:
  workflow_run:
    workflows: ['CI/CD']
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    uses: ./.github/workflows/cloudflare.yml
    with:
      operation: sync-pr-comment
      build-workflow: ci-cd.yml
      pr-base-branch: main
