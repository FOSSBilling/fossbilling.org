name: Cloudflare Events

on:
  workflow_run:
    workflows: ['CI/CD']
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@8c78a3fd6a46bdb6c47edf7046b172e14097ddf0 # main
    with:
      operation: sync-pr-comment
      build-workflow: ci-cd.yml
      pr-base-branch: main
