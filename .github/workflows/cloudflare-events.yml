name: Cloudflare Events

on:
  workflow_run:
    workflows: ['CI/CD']
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.action != 'closed'
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@a477d29315c97bf3218f68ea61ea67967c5a0c51 # main
    with:
      operation: sync-pr-comment
      build-workflow: ci-cd.yml
      pr-base-branch: main

  cleanup:
    name: Delete Cloudflare Preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    # Share the branch's push CI group so cleanup waits for its preview deployment.
    concurrency:
      group: CI/CD-push-refs/heads/${{ github.event.pull_request.head.ref }}
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@c755962efc6008c8484e4c3d649c14e1f622abe7
    with:
      operation: delete-preview
      worker-name: website
      environment: preview
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
