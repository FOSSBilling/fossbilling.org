name: Cloudflare Events

on:
  workflow_run:
    workflows: ['CI/CD']
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.action != 'closed'
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@a477d29315c97bf3218f68ea61ea67967c5a0c51 # main
    with:
      operation: sync-pr-comment
      build-workflow: ci-cd.yml
      pr-base-branch: main

  cleanup:
    name: Delete Cloudflare Preview
    if: >-
      github.event.action == 'closed' && github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {}
    environment:
      name: preview
      deployment: false
    # Share the branch's push CI group so cleanup waits for its preview deployment.
    concurrency:
      group: CI/CD-push-refs/heads/${{ github.event.pull_request.head.ref }}

    steps:
      - name: Delete Preview
        env:
          PREVIEW_NAME: ${{ github.event.pull_request.head.ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_SEND_TELEMETRY: 'false'
          npm_config_ignore_scripts: 'true'
        shell: bash
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Cloudflare API token is required}" "${CLOUDFLARE_ACCOUNT_ID:?Cloudflare account ID is required}"
          if ! output=$(npx cf previews delete "$PREVIEW_NAME" --worker fossbilling-org --force 2>&1) && [[ "$output" != *'[10025] '* ]]; then
            printf '%s\n' "$output" >&2
            exit 1
          fi
