name: CI/CD
run-name: ${{ github.event.pull_request && format('PR {0} {1}', github.event.pull_request.number, github.event.action) || github.event.head_commit.message || github.ref_name }}

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Deleted pushes must not cancel a branch build or deployment.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.deleted && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validation:
    name: Validation
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Dependencies
        id: dependencies
        run: npm ci

      - name: Check Formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run format:check

      - name: Astro Checks
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run check

      - name: Run Tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm test

  build:
    name: Build
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      branch-preview: ${{ steps.preview.outputs.result }}
    env:
      CLOUDFLARE_PREVIEW_BUILD: 'false'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          # The preview must contain the PR head recorded on the CI run.
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
      - name: Select branch preview build
        id: preview
        if: github.repository == 'FOSSBilling/website' && github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const slug = process.env.GITHUB_REF_NAME.normalize('NFKD').replace(/\p{Mark}/gu, '').toLowerCase()
              .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            const enabled = !/^pr-\d+$/.test(slug);
            core.exportVariable('CLOUDFLARE_PREVIEW_BUILD', String(enabled));
            return enabled;

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate Preview Build Output
        if: env.CLOUDFLARE_PREVIEW_BUILD == 'true'
        run: jq -e '.buildContext.isPreview == true and .buildContext.mode == "production"' .cloudflare/output/v1/config.json

      - name: Validate Worker Deployment
        if: env.CLOUDFLARE_PREVIEW_BUILD == 'false'
        run: npm run cf-deploy -- --prebuilt --dry-run --mode production

      - name: Upload Worker Build
        if: >-
          github.repository == 'FOSSBilling/website' &&
          ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || steps.preview.outputs.result == 'true')) ||
           (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository))
        uses: actions/upload-artifact@v7.0.2
        with:
          name: worker-build
          overwrite: true
          path: .cloudflare/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 1 }}

  preview:
    name: Cloudflare Preview
    needs: [validation, build]
    if: ${{ !cancelled() && needs.build.outputs.branch-preview == 'true' }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@5975a63a6914e31472d752b6f8d5538bf5485efb # FOSSBilling/.workflows#63
    with:
      operation: deploy
      mode: preview
      node-version: '26'
      prebuilt: true
      build-result: ${{ needs.build.result }}
      checks-result: ${{ needs.validation.result }}
      pr-comment: true
      pr-base-branch: main
      environment: preview
      artifact-name: worker-build
      artifact-path: .cloudflare/output/
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy Production
    needs: [validation, build]
    if: github.repository == 'FOSSBilling/website' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@5975a63a6914e31472d752b6f8d5538bf5485efb # FOSSBilling/.workflows#63
    with:
      operation: deploy
      mode: production
      node-version: '26'
      prebuilt: true
      environment: production
      artifact-name: worker-build
      artifact-path: .cloudflare/output/
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
