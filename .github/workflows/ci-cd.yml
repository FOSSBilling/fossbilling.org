name: CI/CD

on:
  push:
  pull_request:
    branches: main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        id: dependencies
        run: npm ci

      - name: Check Formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run format:check

      - name: Astro Checks
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run check

      - name: Run Tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate Worker Deployment
        run: npm run cf-deploy -- --dry-run --config dist/server/wrangler.json

      - name: Upload Worker Build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: worker-build
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  preview:
    name: Deploy Preview
    needs: [validation, build]
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    uses: ./.github/workflows/cloudflare-deploy.yml
    with:
      mode: preview
      environment: preview
      artifact-name: worker-build
      artifact-path: dist/
      config-path: dist/server/wrangler.json
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy Production
    needs: [validation, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cloudflare-deploy.yml
    with:
      mode: production
      environment: production
      artifact-name: worker-build
      artifact-path: dist/
      config-path: dist/server/wrangler.json
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
