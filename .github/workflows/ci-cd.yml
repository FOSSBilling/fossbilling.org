name: CI/CD

on:
  push:
  pull_request:
    branches: main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  format:
    name: Check Formatting
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check

  test:
    name: Run Tests
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Validate Worker Deployment
        run: npm run cf-deploy -- --dry-run --config dist/server/wrangler.json
      - name: Upload Worker Build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: worker-build
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  preview:
    name: Deploy Preview
    needs: [typecheck, format, test, build]
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: worker-build
          path: dist/
      - name: Deploy Worker Preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview --config dist/server/wrangler.json
      - name: Add Preview Links to Summary
        uses: actions/github-script@v9
        env:
          PREVIEW_NAME: ${{ steps.preview.outputs.preview-name }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          PREVIEW_BUILD_URL: ${{ steps.preview.outputs.preview-deployment-url }}
        with:
          script: |
            const previewLinks = {
              preview: process.env.PREVIEW_URL,
              build: process.env.PREVIEW_BUILD_URL,
            };
            const tableData = [
              {data: 'Status', header: true},
              {data: 'Name', header: true},
              {data: 'Commit', header: true},
              {data: 'Preview URL', header: true},
              {data: steps.preview.outcome === 'success' ? '✅ Deployment successful!' : ' ❌ Deployment failed!' },
              {data: process.env.PREVIEW_NAME},
              {data: context.sha.substring(0, 7)},
              {data: '<a href="' + previewLinks.build + '">Commit Preview URL</a>\n' + '\n<a href="' + previewLinks.preview + '">Branch Preview URL</a>'},
            ]
            await core.summary
              .addHeading('Deploying Preview to Cloudflare Workers')
              .addTable([tableData])
              .write();
      - name: Upload Preview Links
        uses: actions/upload-artifact@v7
        with:
          name: preview-links
          path: ${{ runner.temp }}/preview-links.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy Production
    needs: [typecheck, format, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://fossbilling.org
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: worker-build
          path: dist/
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
