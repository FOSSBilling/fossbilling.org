name: Actions Lockfile

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/action.yml'
      - '**/action.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify actions.lock
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh extension install github/gh-actions-lock --pin v0.5.1

      - name: Verify Lockfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh actions-lock --verify
